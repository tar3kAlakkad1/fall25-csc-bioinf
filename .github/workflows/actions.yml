name: Week5-6 Notebook CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Provide dataset URLs via repo/environment secrets for CI
      # Set in GitHub: Settings → Secrets and variables → Actions → New repository secret
      ILLUMINA_URL: ${{ secrets.ILLUMINA_URL }}
      PACBIO_URL: ${{ secrets.PACBIO_URL }}
      THREADS: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: '1.5.8'
          environment-name: wk56
          create-args: >-
            python=3.12
            jupyter
            nbconvert
            minimap2
            samtools
            bcftools
            hapcut2
            whatshap
            bbmap
            fastp
          channels: conda-forge,bioconda
          cache-downloads: true
          cache-environment: true

      - name: Install Python requirements
        shell: bash -l {0}
        run: |
          micromamba run -n wk56 python -m pip install --upgrade pip
          micromamba run -n wk56 python -m pip install -r week5_and_6/requirements.txt

      - name: Execute notebook
        shell: bash -l {0}
        run: |
          micromamba run -n wk56 jupyter nbconvert --to notebook --execute week5_and_6/week5.ipynb --ExecutePreprocessor.kernel_name=python3 --ExecutePreprocessor.timeout=7200

      - name: Archive notebook output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week5_and_6-executed-notebook
          path: week5_and_6/week5.nbconvert.ipynb
name: Github CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Install Codon
        run: |
          mkdir -p ${HOME}/.codon
          curl -L https://github.com/exaloop/codon/releases/download/v0.19.3/codon-linux-x86_64.tar.gz | tar zxvf - --strip-components=1 -C ${HOME}/.codon
          curl -L https://github.com/exaloop/seq/releases/download/v0.11.5/seq-linux-x86_64.tar.gz | tar zxvf - -C ${HOME}/.codon/lib/codon/plugins
          export PATH=${PATH}:${HOME}/.codon/bin
          echo "PATH=${PATH}" >> $GITHUB_ENV
      - name: Check out repository code
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Set up Codon Python bridge
        run: |
          pip install find_libpython
          export CODON_PYTHON=$(find_libpython)
          echo "Found Python at: ${CODON_PYTHON}"
          echo "CODON_PYTHON=${CODON_PYTHON}" >> $GITHUB_ENV
      - name: Install Python dependencies for week 4
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          if [ -f week4/python/requirements.txt ]; then pip install -r week4/python/requirements.txt; fi
      - name: Install OpenMP runtime (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libomp5 || sudo apt-get install -y libomp-14-dev || sudo apt-get install -y libomp-dev
      - name: Verify Codon installation
        run: |
          which codon
          codon --version
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - name: Week 4 Tests
        run: bash week4/evaluate.sh
