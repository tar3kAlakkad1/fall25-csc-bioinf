name: Github CI

on: 
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  run-week6:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      THREADS: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: '1.5.8-0'
          environment-name: wk6
          create-args: >-
            python=3.11
            simpleaf
            pip
            jupyter
            nbconvert
            -c conda-forge
            -c bioconda
          cache-downloads: true
          cache-environment: true

      - name: Install Python packages
        shell: bash -l {0}
        run: |
          micromamba run -n wk6 python -m pip install --upgrade pip
          micromamba run -n wk6 python -m pip install \
            scanpy celltypist leidenalg python-igraph umap-learn anndata pyroe

      - name: Execute week6 notebook
        shell: bash -l {0}
        run: |
          cd week6
          micromamba run -n wk6 jupyter nbconvert \
            --to notebook \
            --execute week6.ipynb \
            --inplace \
            --ExecutePreprocessor.timeout=7200

      - name: Archive notebook output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week6-executed-notebook
          path: week6/week6.ipynb
